<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rutinas de sala</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --text:#1c1f24; --muted:#6b7280;
    --line:#e3e6ea; --accent:#3b6ea5; --accent-soft:#e8f0f9; --off:#b8bec6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#121417; --card:#1c1f24; --text:#eceef1; --muted:#9aa1ab;
      --line:#2a2e35; --accent:#7fa8d6; --accent-soft:#1f2a37; --off:#4b515a;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
  .wrap{max-width:480px;margin:0 auto;padding:28px 16px 40px}
  header{text-align:center;margin-bottom:26px}
  header h1{font-size:26px;font-weight:700;letter-spacing:-.3px}
  header p{color:var(--muted);font-size:14px;margin-top:6px}
  section{margin-bottom:24px}
  .cat{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 10px}
  .cat h2{font-size:17px;font-weight:700}
  .cat span{font-size:12px;color:var(--muted)}
  .desc{font-size:13px;color:var(--muted);margin:-4px 4px 10px}
  a.item,div.item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;margin-bottom:8px;text-decoration:none;color:var(--text)}
  a.item:active{transform:scale(.99)}
  .num{flex:0 0 38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
  .info{flex:1}
  .info b{display:block;font-size:15px}
  .info small{color:var(--muted);font-size:12.5px}
  .arrow{color:var(--muted);font-size:20px}
  div.item{opacity:.55}
  div.item .num{background:var(--line);color:var(--off)}
  .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
  .cta{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;margin-top:30px}
  .cta h3{font-size:16px;margin-bottom:6px}
  .cta p{font-size:13.5px;color:var(--muted);margin-bottom:14px}
  .cta a{display:block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;
    padding:13px;border-radius:12px;font-size:15px}
  @media (prefers-color-scheme: dark){ .cta a{color:#121417} }
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Rutinas de sala</h1>
    <p>Entrá a la categoría que te indicó el profe y buscá tu número.</p>
  </header>
  <main id="menu"></main>

  <div class="cta">
    <h3>¿Querés un plan hecho a tu medida?</h3>
    <p>Entrenamiento personalizado según tu objetivo, con seguimiento y progresión.</p>
    <a id="ctaLink" href="#" target="_blank" rel="noopener">Consultar entrenamiento personalizado</a>
  </div>

  <footer>Ante cualquier duda con un ejercicio, consultá al profe de sala.</footer>
</div>

<script>
// ===== CONFIGURACIÓN =====
// Link del botón de abajo. Por ahora abre WhatsApp; si preferís tu landing, pegá la URL acá.
const CTA_URL = "https://wa.me/5491154758578?text=" + encodeURIComponent("Hola Maxi! Vi las rutinas de sala y quiero consultar por entrenamiento personalizado.");

// Cada rutina: número, título, detalle, archivo, lista (true = ya publicada).
const CATEGORIAS = [
  { nombre:"Adaptación", sub:"6 rutinas",
    desc:"Full body para arrancar o volver a entrenar. Técnica y base.",
    rutinas:[
      {n:1, t:"Mujer · 3 días", d:"Full body · énfasis tren inferior", f:"adaptacion-1.html", ok:true},
      {n:2, t:"Mujer · 4 días", d:"Full body · énfasis tren inferior", f:"adaptacion-2.html", ok:true},
      {n:3, t:"Mujer · 5 días", d:"Full body · énfasis tren inferior", f:"adaptacion-3.html", ok:true},
      {n:4, t:"Hombre · 3 días", d:"Full body · énfasis tren superior", f:"adaptacion-4.html", ok:true},
      {n:5, t:"Hombre · 4 días", d:"Full body · énfasis tren superior", f:"adaptacion-5.html", ok:true},
      {n:6, t:"Hombre · 5 días", d:"Full body · énfasis tren superior", f:"adaptacion-6.html", ok:true}
    ]},
  { nombre:"Hipertrofia", sub:"4 días",
    desc:"Para ganar músculo. Rotá entre A, B y C cada 6 a 8 semanas.",
    rutinas:[
      {n:1, t:"Mujer · Variante A", d:"2 tren inferior + 2 tren superior", f:"hipertrofia-1.html", ok:false},
      {n:2, t:"Mujer · Variante B", d:"2 tren inferior + 2 tren superior", f:"hipertrofia-2.html", ok:false},
      {n:3, t:"Mujer · Variante C", d:"2 tren inferior + 2 tren superior", f:"hipertrofia-3.html", ok:false},
      {n:4, t:"Hombre · Variante A", d:"Torso / pierna", f:"hipertrofia-4.html", ok:false},
      {n:5, t:"Hombre · Variante B", d:"Torso / pierna", f:"hipertrofia-5.html", ok:false},
      {n:6, t:"Hombre · Variante C", d:"Torso / pierna", f:"hipertrofia-6.html", ok:false}
    ]},
  { nombre:"Definición", sub:"3 días",
    desc:"Circuitos dinámicos con más gasto energético.",
    rutinas:[
      {n:1, t:"Mujer · 3 días", d:"Circuitos + intervalos", f:"definicion-1.html", ok:false},
      {n:2, t:"Hombre · 3 días", d:"Circuitos + intervalos", f:"definicion-2.html", ok:false}
    ]}
];

// ===== ARMADO DEL MENÚ =====
const menu = document.getElementById("menu");
CATEGORIAS.forEach(c=>{
  let html = `<section><div class="cat"><h2>${c.nombre}</h2><span>${c.sub}</span></div><p class="desc">${c.desc}</p>`;
  c.rutinas.forEach(r=>{
    const inner = `<div class="num">${r.n}</div><div class="info"><b>${r.t}</b><small>${r.d}</small></div>`;
    html += r.ok
      ? `<a class="item" href="${r.f}">${inner}<span class="arrow">›</span></a>`
      : `<div class="item">${inner}<span class="tag">Pronto</span></div>`;
  });
  menu.insertAdjacentHTML("beforeend", html + `</section>`);
});
document.getElementById("ctaLink").href = CTA_URL;
</script>
</body>
</html>
